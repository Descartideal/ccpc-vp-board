<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCPC VP 榜单生成器</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#1b2740;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:880px;margin:7vh auto;padding:28px}.hero{background:linear-gradient(135deg,#15315e,#245b98);color:white;border-radius:22px;padding:34px 38px;box-shadow:0 16px 50px #183b7433}h1{margin:0 0 10px;font-size:30px}.hero p{margin:0;color:#d9e9fc;line-height:1.7}.card{background:white;border:1px solid #dce5ef;border-radius:20px;padding:30px 34px;margin-top:22px;box-shadow:0 8px 30px #193b6110}label{display:block;font-weight:700;margin:20px 0 8px}input{width:100%;padding:13px 14px;border:1px solid #c9d7e7;border-radius:10px;font:inherit;color:#1b2740}input:focus{outline:2px solid #4883d0;border-color:transparent}.hint{font-size:13px;color:#667791;line-height:1.6;margin-top:7px}.or{text-align:center;color:#8391a6;margin:16px 0 -8px}button{border:0;border-radius:10px;background:#2165b3;color:white;padding:13px 22px;font:700 15px inherit;cursor:pointer;margin-top:26px}button:disabled{opacity:.55;cursor:wait}.result{margin-top:20px;padding:16px;border-radius:12px;background:#e8f7ee;color:#176138;display:none}.error{margin-top:20px;color:#a21c32;display:none}.result a{color:#0d5ba6;font-weight:700}footer{color:#708099;line-height:1.6;font-size:13px;margin:22px 4px}@media(max-width:600px){main{margin:0;padding:12px}.hero,.card{padding:24px}}
</style></head><body><main><div class="hero"><h1>CCPC VP 榜单生成器</h1><p>导入 RankLand 榜单，设置开赛时间，生成一个可直接发给队友的独立 HTML。榜单按查看者电脑时间自动推进。</p></div><div class="card"><form id="form"><label for="url">RankLand 榜单链接</label><input id="url" type="url" placeholder="https://rl.algoux.cn/collection/official?rankId=比赛ID"><div class="hint">支持 /ranklist/比赛ID 和合集页 ?rankId=比赛ID，也可使用 RankLand CDN 的 .srk.json 链接。</div><div class="or">或者</div><label for="file">本地 SRK JSON 文件</label><input id="file" type="file" accept=".json,application/json"><div class="hint">选择文件时优先使用本地文件。</div><label for="start">VP 开始时间（你的电脑本地时间）</label><input id="start" type="datetime-local" required><div class="hint">生成时会写入时区。队友在其他时区打开也会看到同一个比赛进度。</div><button id="submit" type="submit">生成 HTML</button></form><div id="error" class="error" role="alert"></div><div id="result" class="result"></div></div><footer>揭榜条件：超过 50 支正式队伍通过，或达到正式队伍总数的 20%，先到者生效。开始后 4 小时显示所有题目并固定成绩。</footer></main><script>
const form=document.querySelector('#form'),start=document.querySelector('#start'),file=document.querySelector('#file'),button=document.querySelector('#submit'),error=document.querySelector('#error'),result=document.querySelector('#result');
const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());start.value=now.toISOString().slice(0,16);
form.addEventListener('submit',async event=>{event.preventDefault();error.style.display='none';result.style.display='none';button.disabled=true;button.textContent='正在导入并生成…';try{const when=new Date(start.value);if(!Number.isFinite(when.getTime()))throw Error('请选择有效的开始时间');let request={startAt:when.toISOString()};if(file.files[0]){request.source='file';request.data=JSON.parse(await file.files[0].text())}else{request.source='url';request.url=document.querySelector('#url').value.trim();if(!request.url)throw Error('请输入榜单链接或选择 JSON 文件')}const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});const data=await response.json();if(!response.ok)throw Error(data.error||'生成失败');result.replaceChildren();const link=document.createElement('a');link.href=data.url;link.download=data.filename;link.textContent='下载 '+data.filename;const preview=document.createElement('a');preview.href=data.url;preview.target='_blank';preview.textContent='打开预览';result.append('生成成功。文件已保存在 output 文件夹。 ',link,'　·　',preview);result.style.display='block'}catch(e){error.textContent=e.message;error.style.display='block'}finally{button.disabled=false;button.textContent='生成 HTML'}});
</script></body></html>
