<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCPC VP 榜单</title><style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#1c2a40;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(135deg,#102f58,#235d9a);color:white;padding:25px max(20px,calc((100vw - 1420px)/2));box-shadow:0 8px 22px #15396322}.top h1{font-size:25px;margin:0 0 12px}.meta{display:flex;flex-wrap:wrap;gap:10px}.pill{background:#ffffff20;border:1px solid #ffffff35;border-radius:9px;padding:8px 11px;font-size:13px}.wrap{max-width:1460px;margin:auto;padding:20px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.toolbar input{border:1px solid #cdd8e7;border-radius:10px;padding:10px 13px;font:inherit;width:min(310px,100%)}.notice{font-size:13px;color:#53647d}.table-wrap{overflow:auto;max-height:calc(100vh - 205px);border:1px solid #dbe3ed;border-radius:14px;background:white;box-shadow:0 8px 28px #1b36550c}table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid #e8edf4;text-align:center;white-space:nowrap}thead th{position:sticky;top:0;z-index:2;background:#eaf0f8;color:#31445f;border-bottom:1px solid #d6e0ed}th.team,td.team{text-align:left;position:sticky;left:0;z-index:1;background:white;min-width:240px;max-width:340px;overflow:hidden;text-overflow:ellipsis}thead th.team{z-index:3;background:#eaf0f8}.rank{width:52px}.score{font-weight:800;color:#194f92}.ac{background:#dff4e8;color:#08713b;font-weight:700}.fb{background:#bcebd1;color:#075f33}.pending{background:#fff1cb;color:#8b5a0b;font-weight:700}.wa{background:#fae9e8;color:#9f3441}.muted{color:#7c8a9d}.star{color:#9b6882}.team small{display:block;color:#8592a3;font-size:11px;font-weight:400;margin-top:3px}.problem-count{display:block;border:0;background:transparent;padding:3px 5px;border-radius:5px;cursor:pointer;font-family:inherit;margin-top:5px;color:#08713b;font-size:12px;font-weight:700}.problem-count:hover,.problem-count[aria-pressed="true"]{background:#cfe3f8;color:#194f92}.problem-filter{display:flex;align-items:center;gap:10px;font-size:13px;color:#194f92}.problem-filter[hidden]{display:none}.clear-filter{border:1px solid #cdd8e7;border-radius:8px;background:white;color:#31445f;padding:7px 10px;cursor:pointer}.problem-title{display:block;font-weight:400;font-size:10px;color:#64758c;max-width:90px;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;color:#748298;padding:44px}footer{max-width:1460px;margin:auto;padding:0 20px 20px;color:#7a889b;font-size:12px}@media(max-width:600px){.top h1{font-size:20px}.wrap{padding:12px}.table-wrap{max-height:calc(100vh - 245px)}th.team,td.team{min-width:175px;max-width:175px}}
</style></head><body><header class="top"><h1 id="title">VP 榜单</h1><div class="meta"><span class="pill" id="mode"></span><span class="pill" id="start"></span><span class="pill" id="clock"></span><span class="pill" id="progress"></span></div></header><main class="wrap"><div class="toolbar"><div class="notice" id="notice"></div><div id="problem-filter" class="problem-filter" hidden><span id="filter-label"></span><button id="clear-filter" class="clear-filter" type="button">显示全部队伍</button></div><input id="search" placeholder="搜索队伍 / 学校" aria-label="搜索队伍"></div><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></main><footer>数据嵌入本 HTML，可离线使用。进度依据查看者设备时间；修改系统时间或查看页面源码可看到未来数据。</footer><script>
const DATA=/*__VP_DATA__*/;
const raw=DATA.ranklist, problems=raw.problems, rows=raw.rows, startMs=Date.parse(DATA.startAt), endMs=4*60*60*1000;
const mode=DATA.mode==='icpc'?'icpc':'ccpc';
const $=selector=>document.querySelector(selector);
function label(value){if(typeof value==='string')return value;if(value&&typeof value==='object')return value['zh-CN']||value.fallback||value.texts?.['zh-CN']||value.en||Object.values(value).find(x=>typeof x==='string')||'';return ''}
function millis(tuple){if(!Array.isArray(tuple))return NaN;const unit=String(tuple[1]||'').toLowerCase();const factor={ms:1,s:1000,sec:1000,min:60000,m:60000,h:3600000}[unit];return Number(tuple[0])*factor}
const durationMs=Math.max(endMs,millis(raw.contest?.duration)||5*60*60*1000);
function ac(result){return result==='AC'||result==='FB'}
// The denominator is every imported participant, including teams with zero submissions.
const participantCount=rows.length;
const required=Math.min(51,Math.ceil(participantCount*.2));
const reveal=problems.map((_,p)=>{if(mode==='icpc')return -Infinity;const times=[];for(const row of rows){const status=row.statuses[p];if(ac(status?.result)){const time=millis(status.time);if(Number.isFinite(time)&&time>=0&&time<=endMs)times.push(time)}}times.sort((a,b)=>a-b);return times.length>=required?Math.min(times[required-1],endMs):endMs});
const noPenalty=new Set(raw.sorter?.config?.noPenaltyResults||['CE','NOUT','UKE','?']);
const penaltyMs=millis(raw.sorter?.config?.penalty||[20,'min']);
const attempts=rows.map(row=>row.statuses.map(status=>{if(!status)return[];const solutions=Array.isArray(status.solutions)?status.solutions:[];if(solutions.length){return solutions.map(s=>({result:s.result,time:millis(s.time)})).filter(s=>Number.isFinite(s.time)&&s.time>=0).sort((a,b)=>a.time-b.time)}const t=millis(status.time);if(Number.isFinite(t)&&t>=0&&status.result!=null)return[{result:status.result,time:t,tries:Number(status.tries)||1,summary:true}];return[]}));
function stateAt(rowIndex,p,elapsed){const status=rows[rowIndex].statuses[p];const list=attempts[rowIndex][p];let wrong=0,solved=false,at=0,seen=false;for(const item of list){if(item.time>elapsed)break;seen=true;if(ac(item.result)){if(ac(status?.result)){solved=true;at=item.time;wrong=item.summary?Math.max(0,item.tries-1):wrong}break}if(item.summary)wrong=Number(status.tries)||0;else if(!noPenalty.has(item.result))wrong++}return{solved,wrong,at,seen}}
// Public results stop at the freeze boundary; later submissions only reveal activity.
function publicStateAt(rowIndex,p,elapsed){
 const frozen=mode==='icpc'&&elapsed>=endMs;
 const state=stateAt(rowIndex,p,frozen?endMs-1:elapsed);
 state.pending=0;state.pendingKnown=true;
 if(frozen&&!state.solved){for(const item of attempts[rowIndex][p]){if(item.time>=endMs&&item.time<=elapsed&&item.time<durationMs){state.pending++;if(item.summary)state.pendingKnown=false}}}
 return state;
}
const eventTimes=Array.from(new Set(attempts.flat(2).map(item=>item.time).concat(reveal.filter(Number.isFinite),[0,endMs,durationMs]))).sort((a,b)=>a-b);
function eventIndex(elapsed){let low=0,high=eventTimes.length;while(low<high){const mid=(low+high)>>1;if(eventTimes[mid]<=elapsed)low=mid+1;else high=mid}return low}
function formatElapsed(ms){const seconds=Math.floor(Math.max(ms,0)/1000);return `${String(Math.floor(seconds/3600)).padStart(2,'0')}:${String(Math.floor(seconds%3600/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function cell(tag,text,cls){const element=document.createElement(tag);element.textContent=text;if(cls)element.className=cls;return element}
let selectedProblem=null;
function render(elapsed){const shown=problems.map((_,i)=>i).filter(i=>elapsed>=reveal[i]);if(selectedProblem!==null&&!shown.includes(selectedProblem))selectedProblem=null;$('#problem-filter').hidden=selectedProblem===null;$('#filter-label').textContent=selectedProblem===null?'':`正在查看 ${problems[selectedProblem].alias||selectedProblem+1} 题通过队伍`;const acceptedCounts=Array(problems.length).fill(0);
const entries=rows.map((row,index)=>{let solved=0,penalty=0;const allStates=problems.map((_,p)=>publicStateAt(index,p,elapsed));for(const [p,state] of allStates.entries()){if(state.solved){acceptedCounts[p]++;solved++;penalty+=Math.floor(state.at/60000)+Math.max(0,state.wrong)*penaltyMs/60000}}const states=shown.map(p=>allStates[p]);return{row,index,states,allStates,solved,penalty}});
const head=$('#head');head.replaceChildren();const tr=document.createElement('tr');tr.append(cell('th','#','rank'),cell('th','队伍','team'),cell('th','通过',''),cell('th','罚时',''));for(const p of shown){const th=cell('th',problems[p].alias||String(p+1));const small=cell('span',label(problems[p].title),'problem-title');const count=cell('button',`通过 ${acceptedCounts[p]} 队`,'problem-count');count.type='button';count.title='点击查看该题通过队伍';count.setAttribute('aria-pressed',String(selectedProblem===p));count.addEventListener('click',()=>{selectedProblem=selectedProblem===p?null:p;lastKey='';tick()});th.append(small,count);tr.append(th)}head.append(tr);
entries.sort((a,b)=>b.solved-a.solved||a.penalty-b.penalty||a.index-b.index);const body=$('#body');body.replaceChildren();const query=$('#search').value.trim().toLowerCase();let officialRank=0,position=0,lastKey='';const frag=document.createDocumentFragment();for(const entry of entries){const user=entry.row.user||{};const name=label(user.name)||String(user.id||'队伍');const org=label(user.organization);if(user.official!==false){position++;const key=`${entry.solved}/${entry.penalty}`;if(key!==lastKey){officialRank=position;lastKey=key}}if(selectedProblem!==null&&!entry.allStates[selectedProblem].solved)continue;if(query&&!`${name} ${org}`.toLowerCase().includes(query))continue;const line=document.createElement('tr');line.append(cell('td',user.official===false?'*':elapsed<0?'—':String(officialRank),'muted'));const team=cell('td',name,'team');if(org)team.append(cell('small',org));line.append(team,cell('td',String(entry.solved),'score'),cell('td',String(Math.round(entry.penalty))));for(const state of entry.states){let content='',cls='';if(state.solved){content=`${Math.floor(state.at/60000)}${state.wrong?` (+${state.wrong})`:''}`;cls='ac'}else if(state.pending){content=`${state.wrong?`−${state.wrong} / `:''}? ${state.pendingKnown?`+${state.pending}`:'已提交'}`;cls='pending'}else if(state.wrong){content=`−${state.wrong}`;cls='wa'}const td=cell('td',content,cls);if(state.pending)td.title='封榜后的提交结果隐藏';line.append(td)}frag.append(line)}if(!frag.childNodes.length){const line=document.createElement('tr');const td=cell('td',selectedProblem===null?'没有匹配的队伍':'当前没有匹配的该题通过队伍','empty');td.colSpan=4+shown.length;line.append(td);frag.append(line)}body.append(frag);$('#notice').textContent=`已显示 ${shown.length}/${problems.length} 题 · ${rows.length} 支队伍${mode==='ccpc'?` · 揭榜门槛：${required} 支参赛队伍通过`: (elapsed>=endMs?' · ICPC 已封榜：黄色 ? 表示新增提交，结果隐藏':' · 普通 ICPC 赛制：提交结果公开')}`}
document.title=`${label(raw.contest?.title)||'VP榜单'} · ${mode.toUpperCase()} VP`;
$('#mode').textContent=mode==='icpc'?'普通 ICPC 赛制':'CCPC 新赛制';
$('#title').textContent=label(raw.contest?.title)||'VP 榜单';
$('#start').textContent=`VP 开始：${new Date(startMs).toLocaleString('zh-CN',{hour12:false})}`;
let lastKey='';function tick(){
 const now=Date.now(),elapsed=Math.min(now-startMs,mode==='icpc'?durationMs:endMs);
 $('#clock').textContent=`当前：${new Date(now).toLocaleString('zh-CN',{hour12:false})}`;
 $('#progress').textContent=elapsed<0?`距开始 ${formatElapsed(-elapsed)}`:mode==='icpc'?(elapsed>=durationMs?'比赛结束 · 保持封榜':`${elapsed>=endMs?'已封榜 · ':''}比赛进度 ${formatElapsed(elapsed)} / ${formatElapsed(durationMs)}`):elapsed>=endMs?'4 小时已到 · 榜单冻结':`比赛进度 ${formatElapsed(elapsed)} / 04:00:00`;
 const key=`${eventIndex(elapsed)}:${elapsed<0}:${elapsed>=endMs}:${$('#search').value}:${selectedProblem}`;
 if(key!==lastKey){render(elapsed);lastKey=key}
}
$('#clear-filter').addEventListener('click',()=>{selectedProblem=null;$('#search').value='';lastKey='';tick()});
$('#search').addEventListener('input',()=>{lastKey='';tick()});tick();setInterval(tick,1000);
</script></body></html>
