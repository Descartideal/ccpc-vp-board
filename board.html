<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCPC VP 榜单</title><style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#1c2a40;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{background:linear-gradient(135deg,#102f58,#235d9a);color:white;padding:25px max(20px,calc((100vw - 1420px)/2));box-shadow:0 8px 22px #15396322}.top h1{font-size:25px;margin:0 0 12px}.meta{display:flex;flex-wrap:wrap;gap:10px}.pill{background:#ffffff20;border:1px solid #ffffff35;border-radius:9px;padding:8px 11px;font-size:13px}.wrap{max-width:1460px;margin:auto;padding:20px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.toolbar input{border:1px solid #cdd8e7;border-radius:10px;padding:10px 13px;font:inherit;width:min(310px,100%)}.notice{font-size:13px;color:#53647d}.table-wrap{overflow:auto;max-height:calc(100vh - 205px);border:1px solid #dbe3ed;border-radius:14px;background:white;box-shadow:0 8px 28px #1b36550c}table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid #e8edf4;text-align:center;white-space:nowrap}thead th{position:sticky;top:0;z-index:2;background:#eaf0f8;color:#31445f;border-bottom:1px solid #d6e0ed}th.team,td.team{text-align:left;position:sticky;left:0;z-index:1;background:white;min-width:240px;max-width:340px;overflow:hidden;text-overflow:ellipsis}thead th.team{z-index:3;background:#eaf0f8}.rank{width:52px}.score{font-weight:800;color:#194f92}.ac{background:#dff4e8;color:#08713b;font-weight:700}.fb{background:#bcebd1;color:#075f33}.wa{background:#fae9e8;color:#9f3441}.muted{color:#7c8a9d}.star{color:#9b6882}.team small{display:block;color:#8592a3;font-size:11px;font-weight:400;margin-top:3px}.problem-title{display:block;font-weight:400;font-size:10px;color:#64758c;max-width:90px;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;color:#748298;padding:44px}footer{max-width:1460px;margin:auto;padding:0 20px 20px;color:#7a889b;font-size:12px}@media(max-width:600px){.top h1{font-size:20px}.wrap{padding:12px}.table-wrap{max-height:calc(100vh - 245px)}th.team,td.team{min-width:175px;max-width:175px}}
</style></head><body><header class="top"><h1 id="title">VP 榜单</h1><div class="meta"><span class="pill" id="start"></span><span class="pill" id="clock"></span><span class="pill" id="progress"></span></div></header><main class="wrap"><div class="toolbar"><div class="notice" id="notice"></div><input id="search" placeholder="搜索队伍 / 学校" aria-label="搜索队伍"></div><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></main><footer>数据嵌入本 HTML，可离线使用。进度依据查看者设备时间；修改系统时间或查看页面源码可看到未来数据。</footer><script>
const DATA=/*__VP_DATA__*/;
const raw=DATA.ranklist, problems=raw.problems, rows=raw.rows, startMs=Date.parse(DATA.startAt), endMs=4*60*60*1000;
const $=selector=>document.querySelector(selector);
function label(value){if(typeof value==='string')return value;if(value&&typeof value==='object')return value['zh-CN']||value.fallback||value.texts?.['zh-CN']||value.en||Object.values(value).find(x=>typeof x==='string')||'';return ''}
function millis(tuple){if(!Array.isArray(tuple))return NaN;const unit=String(tuple[1]||'').toLowerCase();const factor={ms:1,s:1000,sec:1000,min:60000,m:60000,h:3600000}[unit];return Number(tuple[0])*factor}
function ac(result){return result==='AC'||result==='FB'}
const officialCount=rows.filter(r=>r.user?.official!==false).length;
const required=Math.min(51,Math.ceil(officialCount*.2));
const reveal=problems.map((_,p)=>{const times=[];for(const row of rows){if(row.user?.official===false)continue;const status=row.statuses[p];if(ac(status?.result)){const time=millis(status.time);if(Number.isFinite(time)&&time>=0&&time<=endMs)times.push(time)}}times.sort((a,b)=>a-b);return times.length>=required?Math.min(times[required-1],endMs):endMs});
const noPenalty=new Set(raw.sorter?.config?.noPenaltyResults||['CE','NOUT','UKE','?']);
const penaltyMs=millis(raw.sorter?.config?.penalty||[20,'min']);
const attempts=rows.map(row=>row.statuses.map(status=>{if(!status)return[];const solutions=Array.isArray(status.solutions)?status.solutions:[];if(solutions.length){return solutions.map(s=>({result:s.result,time:millis(s.time)})).filter(s=>Number.isFinite(s.time)&&s.time>=0).sort((a,b)=>a.time-b.time)}const t=millis(status.time);if(Number.isFinite(t)&&t>=0&&status.result!=null)return[{result:status.result,time:t,tries:Number(status.tries)||1,summary:true}];return[]}));
function stateAt(rowIndex,p,elapsed){const status=rows[rowIndex].statuses[p];const list=attempts[rowIndex][p];let wrong=0,solved=false,at=0,seen=false;for(const item of list){if(item.time>elapsed)break;seen=true;if(ac(item.result)){if(ac(status?.result)){solved=true;at=item.time;wrong=item.summary?Math.max(0,item.tries-1):wrong}break}if(item.summary)wrong=Number(status.tries)||0;else if(!noPenalty.has(item.result))wrong++}return{solved,wrong,at,seen}}
function formatElapsed(ms){const seconds=Math.floor(Math.max(ms,0)/1000);return `${String(Math.floor(seconds/3600)).padStart(2,'0')}:${String(Math.floor(seconds%3600/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function cell(tag,text,cls){const element=document.createElement(tag);element.textContent=text;if(cls)element.className=cls;return element}
function render(elapsed){const shown=problems.map((_,i)=>i).filter(i=>elapsed>=reveal[i]);const head=$('#head');head.replaceChildren();const tr=document.createElement('tr');tr.append(cell('th','#','rank'),cell('th','队伍','team'),cell('th','通过',''),cell('th','罚时',''));for(const p of shown){const th=cell('th',problems[p].alias||String(p+1));const small=cell('span',label(problems[p].title),'problem-title');th.append(small);tr.append(th)}head.append(tr);
const entries=rows.map((row,index)=>{let solved=0,penalty=0;const allStates=problems.map((_,p)=>stateAt(index,p,elapsed));for(const state of allStates){if(state.solved){solved++;penalty+=Math.floor(state.at/60000)+Math.max(0,state.wrong)*penaltyMs/60000}}const states=shown.map(p=>allStates[p]);return{row,index,states,solved,penalty}});entries.sort((a,b)=>b.solved-a.solved||a.penalty-b.penalty||a.index-b.index);const body=$('#body');body.replaceChildren();const query=$('#search').value.trim().toLowerCase();let officialRank=0,position=0,lastKey='';const frag=document.createDocumentFragment();for(const entry of entries){const user=entry.row.user||{};const name=label(user.name)||String(user.id||'队伍');const org=label(user.organization);if(user.official!==false){position++;const key=`${entry.solved}/${entry.penalty}`;if(key!==lastKey){officialRank=position;lastKey=key}}if(query&&!`${name} ${org}`.toLowerCase().includes(query))continue;const line=document.createElement('tr');line.append(cell('td',user.official===false?'*':elapsed<0?'—':String(officialRank),'muted'));const team=cell('td',name,'team');if(org)team.append(cell('small',org));line.append(team,cell('td',String(entry.solved),'score'),cell('td',String(Math.round(entry.penalty))));for(const state of entry.states){let content='',cls='';if(state.solved){content=`${Math.floor(state.at/60000)}${state.wrong?` (+${state.wrong})`:''}`;cls='ac'}else if(state.wrong){content=`−${state.wrong}`;cls='wa'}line.append(cell('td',content,cls))}frag.append(line)}if(!frag.childNodes.length){const line=document.createElement('tr');const td=cell('td','没有匹配的队伍','empty');td.colSpan=4+shown.length;line.append(td);frag.append(line)}body.append(frag);$('#notice').textContent=`已显示 ${shown.length}/${problems.length} 题 · ${rows.length} 支队伍 · 揭榜门槛：${required} 支正式队伍通过`}
document.title=`${label(raw.contest?.title)||'VP榜单'} · CCPC VP`;
$('#title').textContent=label(raw.contest?.title)||'VP 榜单';
$('#start').textContent=`VP 开始：${new Date(startMs).toLocaleString('zh-CN',{hour12:false})}`;
let lastKey='';function tick(){const now=Date.now(),elapsed=Math.min(now-startMs,endMs);$('#clock').textContent=`当前：${new Date(now).toLocaleString('zh-CN',{hour12:false})}`;$('#progress').textContent=elapsed<0?`距开始 ${formatElapsed(-elapsed)}`:elapsed>=endMs?'4 小时已到 · 榜单冻结':`比赛进度 ${formatElapsed(elapsed)} / 04:00:00`;const shown=problems.reduce((n,_,i)=>n+(elapsed>=reveal[i]),0);const key=`${Math.floor(elapsed/60000)}:${shown}:${elapsed<0}:${elapsed>=endMs}:${$('#search').value}`;if(key!==lastKey){render(elapsed);lastKey=key}}
$('#search').addEventListener('input',()=>{lastKey='';tick()});tick();setInterval(tick,1000);
</script></body></html>
